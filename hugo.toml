baseURL = 'https://blog.yusukeikoma.com/'
title = "Ikoma's Blog"
theme = 'PaperMod'
paginate = 10

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  env = "production"
  description = "Notes on research and learning in CS, ML, and engineering"
  author = "Yusuke Ikoma"
  defaultTheme = "auto"  # auto: follows OS setting
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowWordCount = false
  UseHugoToc = true
  displayFullLangName = true
  disableLangToggle = false

  [params.homeInfoParams]
    Title = "👋 Hi, I'm Yusuke Ikoma"
    Content = "Welcome to my blog. I write about CS, ML/AI, GPU computing, and software engineering."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yusukeikoma"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/IYusuke1205"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/yusuke-ikoma-510459338"

# Math support (KaTeX)
[params.math]
  enable = true

# Search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[languages.en]
  languageCode = "en-us"
  languageName = "English"
  weight = 1
  title = "Ikoma's Blog"

  [languages.en.params]
    languageAltTitle = "English"

  [[languages.en.menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[languages.en.menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[languages.en.menu.main]]
    name = "Archive"
    url = "/archives/"
    weight = 3
  [[languages.en.menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4
  [[languages.en.menu.main]]
    name = "Search"
    url = "/search/"
    weight = 5

[languages.ja]
  languageCode = "ja-jp"
  languageName = "Japanese"
  weight = 2
  title = "Ikoma's Blog"
  hasCJKLanguage = true

  [languages.ja.params]
    languageAltTitle = "Japanese"
    description = "CS、機械学習、エンジニアリングに関する学習と研究のメモ"
    [languages.ja.params.homeInfoParams]
      Title = "👋 こんにちは、Yusuke Ikoma です"
      Content = "ブログへようこそ。CS、機械学習 / AI、GPU コンピューティング、ソフトウェアエンジニアリングについて書いています。"

  [[languages.ja.menu.main]]
    name = "記事"
    url = "/posts/"
    weight = 1
  [[languages.ja.menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
    [languages.ja.menu.main.params]
      skipLangPrefix = true
  [[languages.ja.menu.main]]
    name = "アーカイブ"
    url = "/archives/"
    weight = 3
  [[languages.ja.menu.main]]
    name = "タグ"
    url = "/tags/"
    weight = 4
  [[languages.ja.menu.main]]
    name = "検索"
    url = "/search/"
    weight = 5

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    style = "dracula"
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
